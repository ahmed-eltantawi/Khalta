name: test2
description: "Zikola — AI-Powered Meal Discovery App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.7.0

  # HTTP & Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Camera & Image
  camera: ^0.11.0+2
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.1

  # Computer Vision (ML Kit)
  google_mlkit_image_labeling: ^0.14.0

  # Speech to Text
  speech_to_text: ^7.0.0

  # Navigation
  go_router: ^14.6.2

  # Animations
  lottie: ^3.1.3
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  uuid: ^4.4.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
